name: LWS OIDC Proof Build
on:
  workflow_dispatch:
permissions: {}
jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      actions: read
    steps:
      - name: "1 OIDC claims build (token wordt nooit getoond)"
        shell: bash
        run: |
          set -euo pipefail
          tok=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lws-oidc-proof" | jq -r .value)
          p=$(cut -d. -f2 <<<"$tok" | tr '_-' '/+'); while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
          echo "$p" | base64 -d | jq '{event_name, ref, ref_type, sha, workflow_ref, workflow_sha, job_workflow_ref, job_workflow_sha, run_id, run_attempt, repository}'
      - name: "2 Run-API head_branch/head_sha"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" | jq '{event, head_branch, head_sha, path}'
      - name: "3 git/ref lezen met token ZONDER contents-recht"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -sS -o /tmp/ref.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/${GITHUB_REF#refs/}")
          echo "HTTP $code"
          jq '{ref, type: .object.type, sha: .object.sha}' /tmp/ref.json || cat /tmp/ref.json
